# Render.com Blueprint Specification for Eaglercraft Minecraft Proxy
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: eaglercraft-minecraft-proxy
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev --legacy-peer-deps
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: TARGET_HOST
        value: myserver.aternos.me
      - key: TARGET_PORT
        value: "25565"
